name: Build, Push & Deploy frontend

on:
  push:
    branches: [ deploy ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build imagen
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/casino-frontend
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
      - name: Guardar imagen
        run: |
          docker save 891377088059.dkr.ecr.us-east-1.amazonaws.com/casino-frontend:latest -o /tmp/image.tar
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: /tmp/image.tar

  push:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: /tmp
      - name: Cargar imagen
        run: |
          docker load -i /tmp/image.tar
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push imagen
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/casino-frontend
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  deploy:
    runs-on: ubuntu-latest
    needs: push
    steps:
      - name: Deploy en EC2-frontend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin \
                ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
            docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/casino-frontend:latest
            docker rm -f casino-frontend || true
            docker run -d --name casino-frontend --restart unless-stopped \
              -p 80:8080 \
              -e BACKEND_HOST=${{ secrets.BACKEND_HOST_PRIVATE }} \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/casino-frontend:latest
